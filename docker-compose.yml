version: '3.8'

services:
  # Banking Backend Application
  banking-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-backend-app
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=barankoca
      - DB_PASSWORD=secure_password_123
      - DB_NAME=banking_db
      - DB_SSLMODE=disable
      - JWT_SECRET=your-super-secure-jwt-secret-key-here-must-be-at-least-32-characters
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - RATE_LIMIT_GLOBAL_RPS=10.0
      - RATE_LIMIT_GLOBAL_BURST=20
      - RATE_LIMIT_AUTH_RPS=1.0
      - RATE_LIMIT_AUTH_BURST=3
      - RATE_LIMIT_BANKING_RPS=5.0
      - RATE_LIMIT_BANKING_BURST=10
      - ENABLE_HSTS=true
      - ENABLE_CSP=true
      - ALLOWED_ORIGINS=http://localhost:3000,https://banking-frontend.com
      - TRUSTED_PROXIES=127.0.0.1,::1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: banking-postgres
    environment:
      - POSTGRES_DB=banking_db
      - POSTGRES_USER=barankoca
      - POSTGRES_PASSWORD=secure_password_123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barankoca -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - banking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Database Migration Service (runs once)
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: banking-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PG_URL=postgres://barankoca:secure_password_123@postgres:5432/banking_db?sslmode=disable
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://barankoca:secure_password_123@postgres:5432/banking_db?sslmode=disable", "up"]
    networks:
      - banking-network
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  banking-network:
    driver: bridge
